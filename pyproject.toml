[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noisefloor"
version = "0.1.0"
description = "Random-matrix diagnostics for neural-network weights: find the noise floor, keep the signal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joseph Anggono Kurniawan" }]
keywords = ["random matrix theory", "deep learning", "spectral analysis", "model compression"]
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8", "scikit-learn>=1.3"]
dev = ["pytest>=8", "matplotlib>=3.8", "scikit-learn>=1.3"]

[project.scripts]
noisefloor = "noisefloor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
